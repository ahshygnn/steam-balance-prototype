/* Compact, user-facing layout */
.workspace{gap:0}
.saving-cta{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:16px;padding:13px 12px;border:1px solid #ffefc4;border-radius:12px;background:linear-gradient(110deg,#fff1cc,#ffdf96);color:#633c0f;text-align:left;box-shadow:0 5px 15px #174da326}
.saving-cta:hover:not(:disabled){background:#ffe5a6}
.saving-pitch{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:12px}
.saving-pitch strong{font-size:25px;letter-spacing:-.6px;color:#95491c}
.saving-action{font-size:13px;font-weight:750;white-space:nowrap}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:10px}
.hero-foot .hero-note{margin:0}
.saving-help{border:0;background:none;padding:3px 0;color:#fff;font-size:10px;white-space:nowrap}
.ongoing-list{max-height:258px;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:#aebed5 #e9eef6;padding-right:4px;border-radius:12px}
.ongoing-list::-webkit-scrollbar{width:4px}
.ongoing-list::-webkit-scrollbar-thumb{background:#aebed5;border-radius:4px}
.ongoing-list:focus-visible{outline:2px solid #7eb5ff;outline-offset:3px}
.record-card{padding:11px 12px;margin:0 0 8px;border-radius:12px}
.record-card:last-child{margin-bottom:0}
.record-top strong{font-size:13px}
.record-card p{font-size:10px;line-height:1.5;margin:5px 0}
.record-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px}
.record-bottom b{color:var(--blue)}
.record-saving{color:#aa651d;font-weight:650}
.record-meta{margin-top:4px;font-size:9px}
.list-hint{font-size:10px;color:#8698af;text-align:center;margin:6px 0 0}
.delivery-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#8394aa}
.delivery-heading b{color:#4c617c;font-weight:600}
.arrival-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.arrival-tag{flex:1 1 28%;padding:9px 5px;border-radius:8px;text-align:center}
.arrival-tag>span{display:block;font-size:10px;margin-bottom:5px}
.arrival-tag strong{font-size:22px;line-height:1.2}
.arrival-tag small{font-size:10px;font-weight:400}
.arrival-tag.arrived{background:#eaf8f1;color:#198457}
.arrival-tag.transit{background:#edf5ff;color:#2474d5}
.arrival-tag.pending{background:#f2f4f7;color:#66758a}




/* Focused exchange history and three action steps */
.saving-display{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:11px 13px;border-radius:10px;background:linear-gradient(110deg,#fff2d6,#ffe6b0);color:#754820}
.saving-display .saving-pitch{font-size:12px}
.saving-display .saving-pitch strong{font-size:26px}
.saving-help-inline{width:17px;height:17px;padding:0;border:0;border-radius:50%;background:#dfc28b55;color:#91652c;font-size:11px}
.hero{padding-top:18px;padding-bottom:14px}
.amount{margin-top:12px;margin-bottom:6px}
.hero-foot{margin-top:7px}
.home-action{min-width:158px}
.record-heading{display:flex;align-items:baseline;gap:7px;min-width:0;flex-wrap:wrap}
.record-top{gap:5px}
.record-top strong{font-size:12px;white-space:nowrap}
.record-heading .record-saving{font-size:10px;white-space:nowrap}
.record-card{padding:10px}
.record-card p{margin:7px 0}
.record-meta{margin-top:5px}
.ongoing-list{max-height:none;overflow:visible;padding:0}

.origin-step .target-row{margin-top:3px}
.origin-step .bridge{font-size:11px;padding-top:7px}
.step .head-row{margin-bottom:7px}
.delivery{padding:9px 10px;border-radius:10px}
.arrival-tags{gap:0;flex-wrap:wrap;margin:10px 0 8px}
.arrival-tag{padding:0 7px;background:none!important;border-right:1px solid #e7edf4;border-radius:0}
.arrival-tag:last-child{border-right:0}
.arrival-tag>span{font-size:10px;margin-bottom:3px}
.arrival-tag strong{font-size:21px}

.delivery p{font-size:10px;line-height:1.6;margin:7px 0}
.delivery-actions{margin-top:7px}
.delivery>.tiny{font-size:9px;margin-bottom:0}
.steam-card{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:1px solid #d9e7fb;border-radius:10px;background:#f5f9ff;text-align:left;color:#2f4565}
.steam-card:disabled{opacity:1;cursor:not-allowed;background:#f5f7fa;border-color:#e2e8f0}
.steam-card:disabled .steam-mark{opacity:.55}
.steam-card:disabled .steam-arrow{color:#a4b3c5}
.steam-mark{width:29px;height:29px;border-radius:6px;object-fit:contain;flex:none}
.steam-card-copy{flex:1;min-width:0}
.steam-card-copy b{display:block;font-size:11px;line-height:1.5}
.steam-card-copy small{display:block;font-size:9px;color:#8698ae;line-height:1.6;margin-top:2px}
.steam-arrow{font-size:21px;color:#287fff}
.result-compact{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:10px;color:#7e90a9;margin-top:11px}
.result-compact strong{font-size:19px;color:#247ef1}
.completed-summary{text-align:center;background:#fff;border:1px solid #e1eaf5;border-radius:16px;padding:25px 15px}
.completed-check{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6f7ef;color:#229c72;font-size:24px}
.completed-summary h3{font-size:17px}
.completed-summary p{font-size:12px;color:#7f90a6;line-height:1.8}
.completed-summary>strong{font-size:20px;color:#aa651d}

/* Compact savings and an in-page arrival push preview. */
.saving-display{margin-top:3px;padding:5px 9px;border-radius:7px;min-height:29px}
.saving-display .saving-pitch{font-size:10px;gap:6px}
.saving-display .saving-pitch strong{font-size:18px;letter-spacing:0}
.saving-help-inline{width:14px;height:14px;font-size:9px}
.hero .quick{margin-top:10px}
.push-preview{position:relative;flex:none;margin:9px 12px 0;border:1px solid #dce8f8;background:#fff;border-radius:12px;box-shadow:0 4px 16px #36577c0c}
.push-open{display:flex;gap:9px;width:100%;text-align:left;border:0;background:none;padding:11px 29px 11px 10px;color:#2b405e;border-radius:12px}
.push-symbol{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:#e8f6ef;color:#19996c;margin-top:4px;font-size:17px}
.push-copy{flex:1;min-width:0}
.push-source{display:flex;align-items:center;gap:6px;font-size:9px;color:#8191a6;margin-bottom:4px}
.push-source>span{font-size:8px;background:#f0f4f9;padding:1px 4px;border-radius:3px;color:#8c9caf}
.push-copy strong{display:block;font-size:12px;line-height:1.5}
.push-hint{display:block;font-size:10px;color:#287ce9;margin-top:4px;line-height:1.5}
.push-close{position:absolute;right:3px;top:3px;width:27px;height:27px;border:0;background:none;color:#91a2b6;font-size:19px}
.push-replay{margin-left:16px}

.purchase-content{padding:0!important;background:#f6f6f6}
.bulk-panel{background:#fff;padding:17px 16px 16px}
.bulk-product{display:flex;align-items:center;gap:12px}
.bulk-product>img{width:78px;height:62px;object-fit:contain;border:1px solid #f0f0f0}
.bulk-product h3{font-size:13px;line-height:1.6;margin:0 0 4px}
.bulk-product p{font-size:10px;color:#999;margin:0}
.bulk-prices{display:flex;text-align:center;margin:28px 0}
.bulk-prices>div{flex:1}

.bulk-total{flex:1;align-self:center;color:#202b3d;font-size:13px}

const money=n=>'¥'+(n/100).toFixed(2);
const dateLabel=n=>new Date(n).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const priceFor=i=>i<20?1120:1125;
const purchaseCost=n=>Array.from({length:n},(_,i)=>priceFor(i)).reduce((a,b)=>a+b,0);
const estimate=(target,price)=>{const qty=Math.ceil((target-1e-8)/(price*.85));const spend=purchaseCost(qty),arrival=Math.round(qty*price*.85*100);return {qty,spend,arrival,saved:arrival-spend};};
function counts(r){const c={arrived:0,transit:0,pending:0,cancelled:0};r.items.forEach(i=>c[i.status]++);c.active=c.arrived+c.transit+c.pending;c.gap=Math.max(0,r.qty-c.active);c.ready=c.arrived>=r.qty;return c;}
function paid(r){return r.items.reduce((sum,i)=>sum+(i.status==='cancelled'?0:i.cents),0);}
function c_gap(r){const c=counts(r);return c.gap;}
function abandonReplenish(r){r.qty=counts(r).active;r.abandonedGap=true;save();render();showToast('已放弃补购，本次兑换按已到货数量继续。');}
function status(r){if(r.cancelled)return {key:'cancelled',label:'已取消'};if(r.demoCompleted)return {key:'completed',label:'已完成'};if(!r.paidAt)return {key:'draft',label:'待付款'};const c=counts(r);if(c.ready)return {key:'completed',label:'已完成'};if(c.gap)return {key:'gap',label:'需补购'};return {key:'waiting',label:'等待到货'};}
function newRecord(target,price,id){const e=estimate(target,price);return {id,target,qty:e.qty,quotedPrice:price,createdAt:Date.now(),paidAt:null,cancelled:false,productId:PRODUCT.id,items:[],batches:[],notified:false,checkedAt:null};}
function appendBatch(r,quantity){const batchId='B'+(r.batches.length+1);const cost=purchaseCost(quantity);r.batches.push({id:batchId,qty:quantity,cents:cost,at:Date.now()});for(let i=0;i<quantity;i++)r.items.push({id:batchId+'-'+(i+1),batchId,cents:priceFor(i),status:'pending'});r.paidAt=r.paidAt||Date.now();return cost;}
function seed(){const r=newRecord(550,15.25,'D260911001');r.createdAt=Date.now()-7200000;appendBatch(r,43);r.items.forEach((i,n)=>i.status=n<36?'arrived':n<40?'transit':'pending');r.checkedAt=Date.now();return {version:1,records:[r],notifications:[],auth:'ready',quote:'normal'};}

 for(const [id,complete] of [['EXAMPLE-SHIPPING',false],['EXAMPLE-COMPLETED',true]]){
  if(db.records.some(r=>r.id===id))continue;
  const r=newRecord(550,15.25,id);appendBatch(r,43);r.demoExample=true;r.createdAt=Date.now()-(complete?86400000:7200000);r.checkedAt=Date.now();
  r.items.forEach((item,i)=>item.status=complete?'arrived':i<36?'arrived':'pending');
  r.demoCompleted=complete;r.notified=complete;db.records.push(r);
 }
}

 r.items.forEach((item,i)=>item.status=i<36?'arrived':i<40?'pending':'cancelled');
 db.records.push(r);
}
// A one-time sample push illustrates the arrival deep link.
if(!db.arrivalPushExampleAdded){
 const example=db.records.find(r=>r.id==='EXAMPLE-COMPLETED');
 if(example&&!db.notifications.some(n=>n.recordId===example.id)){
  db.notifications.push({id:'N-'+example.id,recordId:example.id,at:Date.now(),read:false,demo:true});
 }
 db.arrivalPushExampleAdded=true;
}

 dismissedPushId=id;clearTimeout(pushHideTimer);

function renderPush(forcedRecordId){
 const host=document.getElementById('push-preview');
 const notice=forcedRecordId?db.notifications.find(n=>n.recordId===forcedRecordId):[...db.notifications].reverse().find(n=>!n.read&&n.id!==dismissedPushId);
 const record=notice&&db.records.find(r=>r.id===notice.recordId);
 if(!notice||!record||!counts(record).ready){host.hidden=true;host.dataset.noticeId='';clearTimeout(pushHideTimer);return;}
 if(!forcedRecordId&&!host.hidden&&host.dataset.noticeId===notice.id)return;
 clearTimeout(pushHideTimer);
 host.innerHTML=`<button class="push-open" data-action="notification-open" data-id="${record.id}"><span class="push-symbol" aria-hidden="true">YP</span><span class="push-copy"><span class="push-source"><b>悠悠有品</b><span>现在</span></span><strong>省钱买余额 · 饰品已全部到货</strong><span class="push-hint">您购买的 ${record.qty} 把饰品已全部到货，点击查看并前往 Steam 出售。</span></span></button><button class="push-close" data-action="dismiss-push" data-id="${notice.id}" aria-label="收起到货通知">×</button>`;

function recordCard(r){
 const s=status(r),c=counts(r),sold=!!r.demoCompleted;
 const price=sold?r.quotedPrice:quotePrice();
 const saving=Math.round(r.qty*price*.85*100)-(paid(r)+purchaseCost(c.gap));
 const savingText=isOffline()&&!sold?'节省待更新':(sold?'预计已节省 ':'预计可节省 ')+money(saving);
 const text=sold?'饰品出售换余额流程已完成':s.key==='cancelled'?'本次方案已取消':c.ready?'全部到货，可前往 Steam 出售':'已到货 '+c.arrived+' · 待发货 '+c.pending+' 把'+(c.gap?' · 需补购 '+c.gap+' 把':'');
 const deliverySummary=['waiting','gap'].includes(s.key)?`<div class="record-delivery"><span class="pending">待发货 <b>${c.pending} 把</b></span><span class="arrived">已到货 <b>${c.arrived} 把</b></span>${c.gap?`<span class="gap">需补购 <b>${c.gap} 把</b></span>`:''}</div>`:`<p>${text}</p>`;
 const action=s.key==='waiting'?'查看到货':s.key==='gap'?'去补购':s.key==='cancelled'?'查看记录':c.ready&&!sold?'去出售':'查看详情';
 return `<button class="record-card" data-action="record" data-id="${r.id}"><div class="record-top"><div class="record-heading"><strong>目标余额 ¥${r.target.toFixed(2)}</strong><span class="record-saving">${savingText}</span></div><span class="pill ${s.key==='gap'?'orange':s.key==='completed'?'green':''}">${s.label}</span></div>${deliverySummary}<div class="record-meta"><span>${dateLabel(r.createdAt)}${r.demoExample?' · 示例':' · '+r.id.slice(-6)}</span><b>${action} ›</b></div></button>`;
}

function homeValues(){
 const e=estimate(validAmount()?inputAmount:550,quotePrice());
 document.getElementById('saving').textContent=!validAmount()?'—':isOffline()?'待更新':e.saved>0?money(e.saved):'暂无';

 {const max=Math.floor(200*15*0.85);const note=document.getElementById('amount-note');note.classList.remove('note-warn');let noteText='';if(isOffline()){noteText='行情获取失败，请稍后重试。';}else if(validAmount()&&e.saved<=0){noteText='当前暂无价格优势，可稍后查看。';}else if(validAmount()&&e.qty>200){note.classList.add('note-warn');noteText=`当前库存紧张，最多可兑换 ¥${max.toFixed(2)} 元，请修改目标余额。`;}note.textContent=noteText;note.hidden=!noteText;note.parentElement.hidden=!noteText;}
}
function history(){const tabs=[['all','全部'],['completed','已完成'],['waiting','等待到货'],['gap','需补购']];const records=[...db.records].sort((a,b)=>b.createdAt-a.createdAt).filter(r=>r.paidAt&&(historyFilter==='all'||status(r).key===historyFilter));const tabbar=`<div class="filter-tabs" role="tablist" aria-label="按状态筛选兑换记录">${tabs.map(([value,label])=>`<button role="tab" aria-selected="${historyFilter===value}" class="filter-tab${historyFilter===value?' active':''}" data-action="history-filter" data-value="${value}">${label}</button>`).join('')}</div>`;content.innerHTML=`<div class="head-row"><span class="tiny">共 ${db.records.filter(r=>r.paidAt).length} 条兑换记录</span>${tabbar}</div>${records.length?records.map(recordCard).join(''):'<div class="empty">暂无该状态的兑换记录。</div>'}<p class="page-note">全部到货后显示“已完成”。Steam 成交及到账需在 Steam 查看。</p>`;}
function step(n,title,body,kind,extra=''){return `<section class="step ${kind} ${n===0?'origin-step':''}"${kind==='current'?' aria-current="step"':''}><span class="node"${n===0?' role="img" aria-label="起点"':''}>${n===0?'':kind==='done'?'✓':n}</span><div class="head-row"><h3>${title}</h3>${extra}</div>${body}</section>`;}

function buyDialog(replenish=false){
 const r=current();if(!r||r.cancelled)return;
 if(!authReady()){loginDialog();return;}
 if(isOffline()){showToast('行情暂不可用，请重新获取后购买');return;}
 if(!replenish&&r.paidAt){showToast('本次已购买，请查看到货进度');return;}
 const qty=replenish?counts(r).gap:r.qty;
 if(qty<=0){showToast('没有需要补购的缺口');return;}
 if(qty>capacity()){showToast('超出本次账号可购买额度，请调整金额');return;}
 close();purchaseDraft={id:r.id,replenish,qty,required:qty,maxEnabled:false,maxPrice:'',method:'alipay'};
 page='purchase';render();content.scrollTop=0;
}
function purchasePage(){
 const d=purchaseDraft,r=current();
 if(!d||!r||d.id!==r.id){page='detail';render();return;}
 content.innerHTML=`<section class="bulk-panel"><div class="bulk-product"><img src="${PRODUCT.image}" alt="${PRODUCT.name}"><div><h3>${PRODUCT.name}</h3><p>TF2 · 普通</p></div></div><div class="bulk-prices"><div><strong>¥11.20</strong><span>在售最低</span></div><div><strong>¥20.00</strong><span>在售最高</span></div></div><div class="bulk-quantity"><b>购买数量</b><div class="quantity-control"><button data-action="quantity-minus" aria-label="减少购买数量" ${d.qty<=d.required?'disabled':''}>−</button><span>${d.qty}</span><button data-action="quantity-plus" aria-label="增加购买数量" ${d.replenish||d.qty>=purchaseLimit()?'disabled':''}>＋</button></div><small>${purchaseLimit()} 件可购买</small></div></section><div class="bulk-options"><label><input id="purchase-max-enabled" type="checkbox" ${d.maxEnabled?'checked':''}> 设置购买最高价</label>${d.maxEnabled?`<div class="max-price-input"><span>最高单价 ¥</span><input id="purchase-max-price" type="number" min="0.01" step="0.01" inputmode="decimal" value="${d.maxPrice}" placeholder="请输入最高单价"></div>`:''}<p>${d.replenish?'仅补购本次缺口，购买后合并跟进到货。':'数量已按目标余额匹配，不少于本次所需数量。'}</p>${d.qty>d.required?'<p>您增加了购买数量，实际花费和预估到账将随之增加。</p>':''}</div>`;
 footer.hidden=false;footer.innerHTML=`<div class="bulk-total"><span>合计 <strong>${money(purchaseCost(d.qty))}</strong></span><small>已选 ${d.qty} 件 · 下单前重新核价</small></div><button class="primary" data-action="confirm-payment">立即支付</button>`;
}
function paymentConditions(){
 const d=purchaseDraft,r=current();if(!d||!r||r.cancelled||d.id!==r.id)return '本次购买已失效，请返回兑换步骤。';
 const required=d.replenish?counts(r).gap:r.paidAt?0:r.qty;
 if(!authReady()||isOffline()||required!==d.required||d.qty<required||d.qty>capacity()||(d.replenish&&d.qty!==required))return '购买条件已变化，请返回兑换步骤重新核对。';
 if(d.maxEnabled){const cap=Number(d.maxPrice);if(!Number.isFinite(cap)||cap<=0)return '请输入有效的购买最高价。';if(Math.round(cap*100)<priceFor(d.qty-1))return '最高价内的演示库存不足，请提高最高价或取消限制。';}
 return '';
}
function confirmPayment(){
 const error=paymentConditions();if(error){showToast(error);return;}
 const d=purchaseDraft;paymentSession={...d,cents:purchaseCost(d.qty)};
 show('确认支付（批量购买）',`<div class="payment-amount">${money(paymentSession.cents)}</div><div class="payment-warning">商品可能被他人抢购，请尽快完成付款</div><div class="payment-methods"><label class="payment-method ${paymentSession.cents>13053?'unavailable':''}"><span class="pay-logo wallet">YP</span><span>可用余额 <small>¥130.53${paymentSession.cents>13053?' · 余额不足':''}</small></span><input type="radio" name="payment-method" value="balance" ${paymentSession.cents>13053?'disabled':''} ${d.method==='balance'?'checked':''}></label><label class="payment-method"><span class="pay-logo alipay">支</span><span>支付宝</span><input type="radio" name="payment-method" value="alipay" ${d.method==='alipay'?'checked':''}></label><label class="payment-method"><span class="pay-logo card">¥</span><span>支付宝花呗·信用卡</span><input type="radio" name="payment-method" value="card" ${d.method==='card'?'checked':''}></label></div><button class="primary full" data-action="pay">确认付款</button><p class="payment-demo">原型演示：不产生真实扣款，成功后自动返回兑换步骤。</p>`);
 modal.classList.add('payment-sheet');
 const rect=document.querySelector('.phone').getBoundingClientRect();
 modal.style.position='fixed';modal.style.left=rect.left+'px';modal.style.right='auto';modal.style.bottom=Math.max(0,window.innerHeight-rect.bottom)+'px';modal.style.width=rect.width+'px';
}
function pay(){
 const pending=paymentSession;if(!pending)return;
 const error=paymentConditions();if(error){close();render();showToast(error);return;}
 const r=current();if(purchaseCost(pending.qty)!==pending.cents||pending.qty!==purchaseDraft.qty){close();render();showToast('报价已变化，请重新确认。');return;}
 if(!pending.replenish)r.qty=pending.qty;
 appendBatch(r,pending.qty);r.checkedAt=Date.now();save();close();purchaseDraft=null;page='detail';currentId=r.id;openSteps.clear();render();content.scrollTop=0;
 setTimeout(()=>content.querySelector('.step.current')?.scrollIntoView({block:'nearest',behavior:'smooth'}),0);
 showToast(pending.replenish?'补购成功，已合并到本次到货进度':'购买成功，正在等待卖家发货');
}
function loginDialog(){show('Steam 账号',authReady()?`<p>已绑定并登录 · 演示账号</p><p>本次可购买 ${capacity()} 件饰品。账号异常时将在购买前提示。</p><button class="primary full" data-action="close">返回兑换步骤</button>`:'<p>绑定并登录 Steam，以确认接收账号和交易条件。</p><p>此处演示已有账号流程，不输入真实账号或密码。</p><button class="primary full" data-action="logged">模拟绑定并登录</button>');}
function reconcile(r,notify=true){r.checkedAt=Date.now();if(counts(r).ready&&!r.notified){r.notified=true;const n={id:'N-'+r.id,recordId:r.id,at:Date.now(),read:false};db.notifications.push(n);if(notify)dismissedPushId=null;}save();}
function progressRecord(r){if(!r||!r.paidAt||r.cancelled)return;const i=r.items.find(i=>i.status==='transit')||r.items.find(i=>i.status==='pending');if(i)i.status=i.status==='pending'?'transit':'arrived';reconcile(r);}
function notifyOpen(id){const n=db.notifications.find(n=>n.recordId===id);if(n)n.read=true;save();openRecord(id);document.getElementById('toast').hidden=true;setTimeout(()=>content.querySelector('.step.current')?.scrollIntoView({block:'start',behavior:'smooth'}),0);}
function inbox(){show('消息通知',db.notifications.length?[...db.notifications].reverse().map(n=>`<div class="notice"><b>${n.read?'':'● '}饰品已全部到货</b><p>您的省钱买余额饰品已全部到货，请前往详情页查看并到 Steam 出售。</p><p>${dateLabel(n.at)} · ${n.recordId}</p><button class="link" data-action="notification-open" data-id="${n.recordId}">查看兑换步骤 ›</button><button class="link push-replay" data-action="preview-push" data-id="${n.recordId}">预览到货通知</button></div>`).join(''):'<div class="empty">暂无通知。饰品全部到货后，会在这里收到提醒。</div>');}
function orders(){const r=current();if(!r)return;show('本次购买与到货明细',`<p>${r.id} · 本次目标 ${r.qty} 把</p>${r.batches.map(b=>{const items=r.items.filter(i=>i.batchId===b.id);const label={pending:'待发货',arrived:'已到货',cancelled:'失败已退款'};return `<div class="detail-batch"><b>${b.id==='B1'?'首次购买':'补购订单'} ${b.id} · ${b.qty} 把</b><p>${dateLabel(b.at)} · 支付 ${money(b.cents)}</p></div>${Object.keys(label).map(k=>{const list=items.filter(i=>i.status===k);return list.length?`<div class="bill"><span>${label[k]} ${list.length} 把</span><strong>${money(list.reduce((a,i)=>a+i.cents,0))}</strong></div>`:'';}).join('')}`;}).join('')}<div class="bill total"><span>扣除已退款后的净花费</span><strong>${money(paid(r))}</strong></div><p>已到货与待发货互不重复；仍有效的订单计入本次购买数量。</p>`);}
const HELP={replenish:['补购说明','仅补购已确认交易失败并退款的缺口，待发货的饰品无需重复购买。补购按当前在售报价匹配，下单前重新核价；付款后合并到本次兑换记录，继续跟进到货。'],arrival:['预估到账说明','按推荐售价售出并扣费后的预计所得，实际到账以 Steam 成交及结算为准。余额存入 Steam 钱包，可购买游戏或饰品；行情及求购数量变化可能影响成交价格和到账金额。'],saving:['预计节省','预计节省＝预估到账金额－预估购买花费。已购买记录按净花费加预计补购花费估算。实际节省金额以交易结果为准。'],quantity:['数量换算','根据目标 Steam 余额和每件饰品预计出售后扣费所得，换算需要购买的数量；不足一件按一件计算，因此预计到账可能略高于目标。售价、手续费及实际成交情况会影响最终到账。'],cost:['预估花费','当前默认曼恩公司供应箱钥匙方案。从悠悠符合条件的在售商品中由低价到高价匹配，合计各档位的单价乘数量。下单时重新核价，实际花费以支付订单及退款为准。'],price:['推荐出售单价','参考当前 Steam 最高求购价；该档位数量有限，不保证全部按此价格成交。出售前刷新，并核对上架时的价格及预计所得。']};
function scenario(mode){let r=current();if(!r||!r.paidAt){r=db.records.find(r=>r.paidAt&&!r.cancelled);}if(!r){showToast('请先购买，或重置查看示例记录');return;}if(r.notified){showToast('此记录已全部到货，请用重置演示重新体验');return;}if(mode==='all'){r.items.filter(i=>i.status==='pending'||i.status==='transit').forEach(i=>i.status='arrived');}else if(mode==='progress'){progressRecord(r);render();return;}else{if(r.batches.length>1){showToast('补购后请用推进发货或全部到货，避免重置已买订单');return;}const split=Math.max(0,r.qty-7);r.items.forEach((i,n)=>{i.status=n<split?'arrived':n<r.qty-3?'transit':mode==='gap'?'cancelled':'pending';});}reconcile(r);if(page!=='detail'){currentId=r.id;}render();if(mode==='all'&&!counts(r).ready)showToast('在途商品已到货，仍有失败缺口需要补购');}
document.addEventListener('input',e=>{if(e.target.id==='purchase-max-price'&&purchaseDraft)purchaseDraft.maxPrice=e.target.value;if(e.target.id==='target'){inputAmount=Number(e.target.value);homeValues();}});
document.addEventListener('change',e=>{if(e.target.id==='purchase-max-enabled'&&purchaseDraft){purchaseDraft.maxEnabled=e.target.checked;purchasePage();}if(e.target.name==='payment-method'&&purchaseDraft){purchaseDraft.method=e.target.value;if(paymentSession)paymentSession.method=e.target.value;}if(e.target.id==='auth'){db.auth=e.target.value;save();render();}if(e.target.id==='quote'){db.quote=e.target.value;save();render();}if(e.target.id==='auto'){clearInterval(timer);timer=e.target.checked?setInterval(()=>{db.records.filter(r=>r.paidAt&&!r.cancelled&&!counts(r).ready).forEach(progressRecord);render();},10000):null;}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const r=current();switch(b.dataset.action){case'mine-toast':showToast(b.dataset.msg);break;case'stock-block':capacityDialog(r?r.qty:0);break;case'abandon-replenish':{if(r&&c_gap(r)>0){abandonReplenish(r);}break;}case'open-balance':page='home';render();content.scrollTop=0;break;case'amount':inputAmount=Number(b.dataset.value);home();break;case'create':if(!validAmount()||isOffline())return;{const rec=newRecord(inputAmount,quotePrice(),'D'+Date.now().toString(36).toUpperCase());db.records.unshift(rec);save();openRecord(rec.id);}break;case'record':openRecord(b.dataset.id,page==='history');break;case'home':page='home';render();break;case'toggle-history':historyCollapsed=!historyCollapsed;document.getElementById('history-content').hidden=historyCollapsed;document.getElementById('history-panel').classList.toggle('is-collapsed',historyCollapsed);b.setAttribute('aria-expanded',String(!historyCollapsed));b.querySelector('.history-toggle-label').textContent=historyCollapsed?'展开':'收起';break;case'history':page='history';render();content.scrollTop=0;break;case'history-filter':historyFilter=b.dataset.value;history();content.scrollTop=0;break;case'toggle':{const n=Number(b.dataset.step);openSteps.has(n)?openSteps.delete(n):openSteps.add(n);detail();}break;case'edit-target':if(r&&!r.paidAt)show('修改目标余额',`<p>调整金额会重新计算本次购买数量。</p><input id="edit-amount" type="number" min="1" max="100000" step="0.01" value="${r.target.toFixed(2)}" aria-label="目标余额"><button class="primary full" data-action="save-target">保存金额</button><button class="link wide-link" data-action="cancel-record">取消本次未付款方案</button>`);break;case'save-target':{const value=Number(document.getElementById('edit-amount').value);if(!Number.isFinite(value)||value<1||value>100000||isOffline()){showToast('请检查金额或行情');return;}r.target=value;r.qty=estimate(value,quotePrice()).qty;r.quotedPrice=quotePrice();save();close();detail();}break;case'cancel-record':if(r&&!r.paidAt){r.cancelled=true;save();close();page='home';render();}break;case'fit':if(r&&!r.paidAt){r.target=Math.floor(purchaseLimit()*quotePrice()*.85*100)/100;r.qty=estimate(r.target,quotePrice()).qty;save();detail();}break;case'login':loginDialog();break;case'logged':db.auth='ready';save();close();render();break;case'key-minus':case'key-plus':{if(!r||r.paidAt||isOffline())break;const next=Math.min(purchaseLimit(),Math.max(1,r.qty+(b.dataset.action==='key-plus'?1:-1)));if(next===r.qty)break;r.qty=next;r.target=Math.floor(next*quotePrice()*.85*100)/100;r.quotedPrice=quotePrice();save();detail();break;}case'buy':buyDialog(false);break;case'replenish':{const _r=current();if(_r&&c_gap(_r)>systemStock()){e.stopImmediatePropagation();edgeSystemStockDialog(_r);break;}buyDialog(true);break;}case'confirm-payment':confirmPayment();break;case'quantity-minus':if(purchaseDraft&&purchaseDraft.qty>purchaseDraft.required){purchaseDraft.qty--;purchasePage();}break;case'quantity-plus':if(purchaseDraft&&!purchaseDraft.replenish&&purchaseDraft.qty<capacity()){purchaseDraft.qty++;purchasePage();}break;case'pay':pay();break;case'orders':orders();break;case'check':if(r&&r.paidAt){reconcile(r);render();showToast('已更新本次到货状态');}break;case'refresh-quote':db.quote='normal';save();render();showToast('已刷新演示推荐售价');break;case'tutorial':show('如何出售饰品','<p>① 在 Steam 库存中找到本次收到的 TF2 钥匙。</p><p>② 选择出售，核对价格、费用和预计所得。</p><p>③ 按 Steam 提示完成上架与确认。成交及结算情况请在 Steam 查看。</p>');break;case'help':{const info=HELP[b.dataset.kind];show(info[0],'<p>'+info[1]+'</p>');}break;case'inbox':inbox();break;case'dismiss-push':dismissPush(b.dataset.id);break;case'preview-push':close();renderPush(b.dataset.id);break;case'notification-open':notifyOpen(b.dataset.id);break;case'scenario':scenario(b.dataset.mode);break;case'progress':scenario('progress');break;case'all':scenario('all');break;case'reset':show('重置演示记录','<p>将清除本原型的本地演示记录和通知，恢复 36 把已到货、7 把待到货的示例。</p><button class="primary full" data-action="confirm-reset">重置演示</button>');break;case'confirm-reset':clearInterval(timer);timer=null;db=seed();page='home';currentId=null;openSteps.clear();save();close();render();break;case'close':close();break;}});

window.balancePrototypeConfig={arrivalHours:'XX',bindUrl:null};
window.balancePrototypeEvents=[];
function trackBalance(event,fields={}){const entry={event,at:Date.now(),recordId:currentId,...fields};window.balancePrototypeEvents.push(entry);window.dispatchEvent(new CustomEvent('balance-analytics',{detail:entry}));}
function inventoryCheck(qty){const maximum=db.auth==='limited'?20:96,occupied=inventoryHeld(),reserved=0;const available=Math.max(0,maximum-occupied-reserved);trackBalance('inventory_check',{qty,maximum,occupied,reserved,available,result:qty<=available?'pass':'insufficient',demo:true});return {maximum,occupied,reserved,available};}
function capacityDialog(qty){const c=inventoryCheck(qty);const m=Math.floor(c.available*15*0.85);trackBalance('inventory_insufficient_exposure',{qty,available:c.available});show('库存容量不足',`<p>您当前库存容量不足，请减少目标余额，目前最多可兑换 <b>¥${m.toFixed(2)}</b> Steam 余额。</p><p class="tiny">当前在售 ${c.available} 把 · 剩余容量按 ¥15/把 出售价扣除约 15% 手续费估算。</p><button class="primary full" data-action="fit">修改目标余额</button><button class="link wide-link" data-action="close">返回兑换步骤</button>`);}
const originalDetail=detail;
detail=function(){originalDetail();const row=content.querySelector('.account-row');if(row){row.innerHTML=authReady()?`<span class="account-copy"><i>● <em>Steam交易正常</em></i></span>`:`<span>尚未绑定 Steam 账号</span><button class="link" data-action="login">去绑定</button>`;trackBalance('steam_binding_exposure',{bound:authReady()});}for(const p of content.querySelectorAll('.delivery > p'))if(p.textContent==='全部到货后通知您，无需在此等待。')p.textContent=`预计全部到货${window.balancePrototypeConfig.arrivalHours}小时以内，全部到货后通知您，无需在此等待。`;};
loginDialog=function(){trackBalance('steam_binding_entry_click',{bound:authReady()});show('Steam 绑定与库存校验',`<p>${authReady()?'已绑定 Steam · 演示账号':'请先绑定 Steam 账号，以确认饰品接收账号。'}</p>${!authReady()?'<button class="primary full" data-action="binding-page">前往绑定 Steam</button>':'<button class="primary full" data-action="capacity-recheck">检测接收容量</button>'}<details style="margin-top:16px"><summary class="tiny">原型情境演示</summary><p class="tiny">仅切换模拟数据，不修改真实账号。</p><button class="link wide-link" data-action="demo-unbound">未绑定 Steam</button><button class="link wide-link" data-action="demo-limited">容量不足（可接收 20 把）</button><button class="link wide-link" data-action="demo-ready">已绑定且容量充足</button><button class="link wide-link" data-action="demo-gap-settled">全部求购结束，演示需补购通知</button><button class="link wide-link" data-action="demo-delivered">补购后全部到货</button></details>`);};
function noticeCopy(n){return n.type==='replenish'?{title:'省钱买余额·饰品需要补购',body:`您购买的${n.qty}把饰品已到货${n.arrived}把，需要补购${n.gap}把，请点击进行补购。`}:{title:'省钱买余额 · 饰品已全部到货',body:`您购买的${n.qty||db.records.find(r=>r.id===n.recordId)?.qty||0}把饰品已全部到货，点击查看并前往 Steam 出售。`};}
reconcile=function(r,notify=true){r.checkedAt=Date.now();const c=counts(r);const type=c.ready?'arrival':c.gap>0&&c.pending===0&&c.transit===0?'replenish':null;if(type){const id=`N-${r.id}-${type}-${r.batches.length}`;const already=type==='arrival'&&r.notified;if(!already&&!db.notifications.some(n=>n.id===id)){db.notifications.push({id,recordId:r.id,type,qty:r.qty,arrived:c.arrived,gap:c.gap,at:Date.now(),read:false});if(type==='arrival')r.notified=true;if(notify)dismissedPushId=null;trackBalance('notification_trigger',{type,qty:r.qty,arrived:c.arrived,gap:c.gap});}}save();};
renderPush=function(forcedId){const host=document.getElementById('push-preview');const n=forcedId?[...db.notifications].reverse().find(n=>n.id===forcedId||n.recordId===forcedId):[...db.notifications].reverse().find(n=>!n.read&&n.id!==dismissedPushId);if(!n){host.hidden=true;return;}const r=db.records.find(r=>r.id===n.recordId);if(!r){host.hidden=true;return;}const c=counts(r);if(n.type==='replenish'&&(!c.gap||c.pending||c.transit)){host.hidden=true;return;}if(!forcedId&&!host.hidden&&host.dataset.noticeId===n.id)return;const copy=noticeCopy(n);clearTimeout(pushHideTimer);host.innerHTML=`<button class="push-open" data-action="notification-open" data-id="${r.id}"><span class="push-symbol">YP</span><span class="push-copy"><span class="push-source"><b>悠悠有品</b><span>现在</span></span><strong>${copy.title}</strong><span class="push-hint">${copy.body}</span></span></button><button class="push-close" data-action="dismiss-push" data-id="${n.id}" aria-label="收起通知">×</button>`;host.dataset.noticeId=n.id;host.hidden=false;trackBalance('notification_exposure',{type:n.type||'arrival',noticeId:n.id});pushHideTimer=setTimeout(()=>dismissPush(n.id),8000);};
notifyOpen=function(id){const n=db.notifications.find(n=>n.id===document.getElementById('push-preview').dataset.noticeId&&n.recordId===id)||[...db.notifications].reverse().find(n=>n.recordId===id&&!n.read);if(n){n.read=true;dismissedPushId=n.id;}trackBalance('notification_click',{type:n?.type||'arrival'});save();openRecord(id);document.getElementById('toast').hidden=true;setTimeout(()=>content.querySelector('.step.current')?.scrollIntoView({block:'start',behavior:'smooth'}),0);};
inbox=function(){show('消息通知',db.notifications.length?[...db.notifications].reverse().map(n=>{const copy=noticeCopy(n);return `<div class="notice"><b>${n.read?'':'● '}${copy.title}</b><p>${copy.body}</p><p>${dateLabel(n.at)}</p><button class="link" data-action="notification-open" data-id="${n.recordId}">查看兑换步骤 ›</button><button class="link" data-action="preview-push" data-id="${n.id}">预览通知</button></div>`;}).join(''):'<div class="empty">暂无通知。全部求购结束需补购，或全部饰品到货后，将收到提醒。</div>');};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,r=current();if(['buy','replenish','confirm-payment','pay'].includes(a)){trackBalance('purchase_precheck',{bound:authReady(),action:a});if(!authReady()){e.stopImmediatePropagation();loginDialog();return;}const qty=purchaseDraft&&page==='purchase'?purchaseDraft.qty:a==='replenish'?counts(r).gap:r?.qty||0;if(qty>inventoryCheck(qty).available){e.stopImmediatePropagation();capacityDialog(qty);return;}}const actions=['binding-page','demo-unbound','demo-limited','demo-ready','capacity-recheck','demo-gap-settled','demo-delivered'];if(!actions.includes(a))return;e.stopImmediatePropagation();if(a==='binding-page'){trackBalance('steam_binding_redirect');const url=window.balancePrototypeConfig.bindUrl;if(url){window.location.assign(url);return;}show('绑定 Steam（原型占位页）','<p>正式版本在此接入悠悠有品 Steam 绑定页，绑定后返回当前兑换步骤重新校验。</p><p class="tiny">此处不输入真实账号或密码。</p><button class="primary full" data-action="logged">模拟绑定成功并返回</button>');}else if(a.startsWith('demo-')&&['demo-unbound','demo-limited','demo-ready'].includes(a)){db.auth=a==='demo-unbound'?'unbound':a==='demo-limited'?'limited':'ready';save();close();render();if(a==='demo-limited')capacityDialog(r?.qty||43);else loginDialog();}else if(a==='capacity-recheck'){const qty=purchaseDraft&&page==='purchase'?purchaseDraft.qty:r?.paidAt?counts(r).gap:r?.qty||43;if(!authReady()){loginDialog();return;}if(qty>inventoryCheck(qty).available)capacityDialog(qty);else{close();render();showToast('检测通过，当前接收容量充足（演示）');}}else if(a==='demo-gap-settled'){const rec=db.records.find(x=>x.id==='EXAMPLE-REPLENISH');if(rec.batches.length>1){showToast('此示例已补购，请使用当前到货进度');return;}rec.items.forEach(i=>{if(i.status==='pending'||i.status==='transit')i.status='arrived';});close();openRecord(rec.id);reconcile(rec);render();}else if(a==='demo-delivered'){if(!r?.paidAt){showToast('请先进入已购买的兑换记录');return;}close();scenario('all');}},true);

function demoPanel(){show('原型情境演示',`<p class="tiny">以下均为模拟数据，不涉及真实绑定、支付或推送。</p><button class="primary full" data-action="demo-edge">重演本页边界场景</button><button class="primary full" data-action="demo-notice-gap">演示需要补购 Push</button><button class="primary full" data-action="demo-notice-arrival">演示全部到货 Push</button><button class="link wide-link" data-action="demo-delivered">将当前已购记录推进至全部到货</button><button class="link wide-link" data-action="demo-account-unbound">演示未绑定 Steam</button><button class="link wide-link" data-action="demo-account-limited">演示库存容量不足</button><button class="link wide-link" data-action="demo-account-ready">恢复账号正常</button><p class="tiny">完整流程：补购 Push → 点击通知 → 补购 3 把 → 模拟支付 → 再打开演示，将当前记录推进至全部到货。</p>`);}
document.querySelector('.statusbar').insertAdjacentHTML('beforeend','<button data-action="demo-panel" style="border:0;background:#edf4ff;color:#187bff;border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer">演示</button>');
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='demo-panel'){e.stopImmediatePropagation();demoPanel();return;}if(a==='demo-notice-gap'||a==='demo-notice-arrival'){e.stopImmediatePropagation();const id='DEMO-PUSH-'+(a==='demo-notice-gap'?'GAP':'ARRIVAL');let r=newRecord(550,15.25,id);r.demoExample=true;appendBatch(r,43);r.items.forEach((i,n)=>i.status=a==='demo-notice-gap'&&n>=40?'cancelled':'arrived');const index=db.records.findIndex(x=>x.id===id);if(index<0)db.records.push(r);else db.records[index]=r;db.notifications=db.notifications.filter(n=>n.recordId!==id);db.auth='ready';close();openRecord(id);reconcile(r);render();renderPush(id);trackBalance('demo_notification_replay',{type:a});return;}if(a.startsWith('demo-account-')){e.stopImmediatePropagation();db.auth=a.endsWith('unbound')?'unbound':a.endsWith('limited')?'limited':'ready';let r=db.records.find(x=>x.id==='DEMO-ACCOUNT');if(!r){r=newRecord(550,15.25,'DEMO-ACCOUNT');db.records.push(r);}save();openRecord(r.id);if(db.auth==='limited')capacityDialog(r.qty);return;}},true);
const detailWithSafeguards=detail;
detail=function(){detailWithSafeguards();if(!authReady()){const button=content.querySelector('.product button[data-action="login"]');if(button)button.textContent='去绑定';}};
const demoHome=home;
home=function(){demoHome();};
const withoutEtaDetail=detail;
detail=function(){withoutEtaDetail();for(const p of content.querySelectorAll('.delivery > p'))if(p.textContent.startsWith('预计全部到货'))p.textContent='全部到货后通知您，无需在此等待。';};
const timedPush=renderPush;
renderPush=function(id){timedPush(id);clearTimeout(pushHideTimer);};
render();

// Independent history examples; never overwrite existing user or demo records.
for(const [id,target,gap,pending,age] of [
 ['EXAMPLE-GAP-1',100,1,0,1800000],
 ['EXAMPLE-GAP-5',200,5,2,3600000],
 ['EXAMPLE-GAP-8',500,8,0,5400000]
]){
 if(db.records.some(r=>r.id===id))continue;
 const r=newRecord(target,15.25,id);appendBatch(r,r.qty);r.demoExample=true;r.createdAt=Date.now()-age;r.checkedAt=Date.now();
 r.items.forEach((item,i)=>item.status=i<gap?'cancelled':i<gap+pending?'pending':'arrived');
 db.records.push(r);
}
save();render();

/* ===== 边界兜底演示 ② ===== */
let EDGE_ID='';
const EDGE_HELD=12, EDGE_SYS=2;
function edgeSetup(){
  window.__held=EDGE_HELD;window.__sysStock=EDGE_SYS;
  db={version:1,records:[],notifications:[],auth:'ready',quote:'normal'};
  ensureHistoryExamples();

  const r=newRecord(550,15.25,'EDGE-SYSSTOCK');appendBatch(r,r.qty);
  r.items.forEach((it,i)=>it.status=i<36?'arrived':i<40?'transit':'cancelled');
  r.checkedAt=Date.now();db.records.push(r);EDGE_ID=r.id;
  save();openRecord(EDGE_ID);
}
function edgeCleanupDialog(){show('前往 Steam 清理库存',`<p>已跳转 Steam 库存页面（演示）。清理完成后返回本页。</p><p class="tiny">演示环境，不涉及真实 Steam 操作。</p><button class="primary full" data-action="cleanup-done">已完成清理，返回</button><button class="link wide-link" data-action="close">暂不清理</button>`);}

function edgeDiff(r){const c=counts(r);const stock=Math.min(systemStock(),c.gap);const max=Math.floor((c.active+stock)*quotePrice()*.85*100);return Math.max(0,Math.round(r.target*100)-max);}
function edgeSystemStockDialog(r){const gap=c_gap(r),stock=systemStock(),c=counts(r);const max=Math.floor((c.active+stock)*quotePrice()*.85*100);const diff=Math.max(0,Math.round(r.target*100)-max);show('系统库存不足',`<p>当前系统库存不足，最多可购买 <b>${stock}</b> 把钥匙，最多可兑换的 Steam 余额为 <b>${money(max)}</b> 元，离目标余额还差 <b>${money(diff)}</b> 元，建议您自行充值差额。</p><p class="tiny">本次需补购 ${gap} 把 · 系统当前在售 ${stock} 把 · 已到货及在途 ${c.active} 把。</p><button class="primary full" data-action="recharge-back">返回</button>`);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const r=current();
  switch(b.dataset.action){
    case 'demo-edge':e.stopImmediatePropagation();close();edgeSetup();break;
    case 'cleanup':e.stopImmediatePropagation();edgeCleanupDialog();break;
    case 'cleanup-done':{e.stopImmediatePropagation();const need=r?(r.paidAt?c_gap(r):r.qty):0;window.__held=Math.max(0,capacity()-(need+1));save();close();detail();showToast('库存已清理，可继续本次兑换');break;}

    case 'recharge-back':{e.stopImmediatePropagation();if(r){r.rechargeAdvice=edgeDiff(r);save();}close();detail();break;}
  }
});
function edgeBanner(){
  const box=document.getElementById('content');
  if(box&&!box.querySelector('.edge-banner'))box.insertAdjacentHTML('afterbegin','<div class="edge-banner">边界演示 ②：补购时，超过系统在售库存</div>');
}
const edgeRenderBefore=render;
render=function(){
  edgeRenderBefore();edgeBanner();
};
const edgeDetailBefore=detail;
detail=function(){
  edgeDetailBefore();edgeBanner();
};
edgeSetup();
</script></body></html>
